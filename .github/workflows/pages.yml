name: Publish shared-DSP audio preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'web-demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frequency-warp-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Compile the same native DSP core to WASM
        run: cargo build --manifest-path core/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Stage browser-only static assets
        run: |
          mkdir -p _site
          cp web-demo/index.html _site/index.html
          cp web-demo/app.mjs web-demo/processor.worker.mjs web-demo/realtime.worklet.js web-demo/dsp.mjs web-demo/style.css _site/
          cp core/target/wasm32-unknown-unknown/release/frequency_warp_core.wasm _site/dsp_core.wasm
          touch _site/.nojekyll
          test -s _site/dsp_core.wasm
      - name: Configure GitHub Pages (requires existing Pages enablement)
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
