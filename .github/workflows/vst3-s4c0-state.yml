name: S4c0 VST3 saved engine state codec
on:
  pull_request:
    paths:
      - 'vst3/src/ui_asset_policy.h'
      - 'vst3/src/ui_asset_snapshot.h'
      - 'vst3/src/ui_manifest_approval.h'
      - 'vst3/src/ui_pinned_resource_router.h'
      - 'vst3/src/ui_activation_transaction.h'
      - 'vst3/tools/**'
      - 'vst3/src/native_engine_abi.h'
      - 'fwengine-runtime/src/ffi.rs'
      - 'vst3/src/native_binding_flow.h'
      - 'vst3/src/engine_project_state.h'
      - 'vst3/src/parameter_state_mailbox.h'
      - 'vst3/src/shell.cpp'
      - 'vst3/tests/state/**'
      - '.github/workflows/vst3-s4c0-state.yml'
  push:
    branches: [main]
    paths:
      - 'vst3/src/ui_asset_policy.h'
      - 'vst3/src/ui_asset_snapshot.h'
      - 'vst3/src/ui_manifest_approval.h'
      - 'vst3/src/ui_pinned_resource_router.h'
      - 'vst3/src/ui_activation_transaction.h'
      - 'vst3/tools/**'
      - 'vst3/src/native_engine_abi.h'
      - 'fwengine-runtime/src/ffi.rs'
      - 'vst3/src/native_binding_flow.h'
      - 'vst3/src/engine_project_state.h'
      - 'vst3/src/parameter_state_mailbox.h'
      - 'vst3/src/shell.cpp'
      - 'vst3/tests/state/**'
      - '.github/workflows/vst3-s4c0-state.yml'
permissions:
  contents: read
jobs:
  portable-codec:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone engine state codec tests
        run: cmake -S vst3/tests/state -B _state_build -DCMAKE_BUILD_TYPE=Release
      - name: Compile C++17
        run: cmake --build _state_build --config Release
      - name: Run v1/v2 serialization, concurrent state and corruption tests
        run: ctest --test-dir _state_build -C Release --output-on-failure

  ui-digest-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test native FWUI manifest generation with no network
        run: node --test vst3/tools/create-fwui-manifest.test.mjs
      - name: Verify actual native sha2 FFI golden vectors
        run: cargo test --manifest-path fwengine-runtime/Cargo.toml --lib ui_sha256_tests::sha256_vectors_and_invalid_outputs
