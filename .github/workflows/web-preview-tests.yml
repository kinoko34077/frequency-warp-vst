name: Browser audio preview and shared Rust/WASM CI

on:
  pull_request:
    paths:
      - 'core/**'
      - 'web-demo/**'
      - 'docs/CAPABILITY_API_CATALOG.md'
      - '.github/workflows/web-preview-tests.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'web-demo/**'
      - 'docs/CAPABILITY_API_CATALOG.md'
      - '.github/workflows/web-preview-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure native Rust and WASM toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Native Rust core tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Build exact same Rust DSP for WASM
        run: |
          cargo build --manifest-path core/Cargo.toml --release --target wasm32-unknown-unknown
          cp core/target/wasm32-unknown-unknown/release/frequency_warp_core.wasm web-demo/dsp_core.wasm
          test -s web-demo/dsp_core.wasm
      - name: Enforce canonical numeric-unit API reuse (negative regression fixtures)
        run: node --test web-demo/capability-reuse-check.test.mjs
      - name: UI-only helper checks
        run: node --test web-demo/settings-realtime-contract.test.mjs web-demo/dsp.test.mjs web-demo/harmonics.test.mjs web-demo/virtual-root-plan.test.mjs web-demo/virtual-root-rail.test.mjs web-demo/digit-wheel-picker.test.mjs web-demo/engine-policy.test.mjs web-demo/export-policy.test.mjs web-demo/crusher-visual.test.mjs web-demo/audio-route.test.mjs web-demo/stage-pages.test.mjs web-demo/parameter-units.test.mjs web-demo/parameter-binding.test.mjs web-demo/percent-parameter-field.test.mjs web-demo/integer-parameter-field.test.mjs web-demo/frequency-bounds.test.mjs web-demo/stream-parameter-contract.test.mjs web-demo/playback-feedback.test.mjs web-demo/audition-feedback-view.test.mjs web-demo/configuration-snapshot.test.mjs web-demo/export-identity.test.mjs web-demo/axis-shift-view.test.mjs web-demo/realtime-worklet-rms.test.mjs web-demo/realtime-worklet-rollback.test.mjs web-demo/visual-editor-core.test.mjs web-demo/visual-editor-platform/core.test.mjs web-demo/visual-editor-platform/model-adapter.test.mjs web-demo/visual-editor-platform/export.test.mjs
      - name: Shared WASM math and real audio output checks
        run: node --test web-demo/core-wasm.test.mjs web-demo/all-reflections.test.mjs
      - name: Install headless Chrome client
        run: |
          npm install --no-save --no-package-lock puppeteer-core@24 react@19 react-dom@19
          command -v google-chrome
      - name: Shared editor React and scene-owned model integration proof
        run: node --test web-demo/visual-editor-platform/react-scene.test.mjs
      - name: Stage the exact public Pages artifact before Chrome tests
        run: |
          node web-demo/stage-pages.mjs web-demo/dsp_core.wasm
          test -s _site/engine-policy.mjs
          test -s _site/export-policy.mjs
          test -s _site/crusher-visual.mjs
          test -s _site/dual-thumb.mjs
      - name: Chrome realtime streaming and waveform seek against staged Pages
        run: |
          WARP_WEB_ROOT=_site node --test web-demo/virtual-root-workbench.browser.test.mjs
          WARP_WEB_ROOT=_site node --test web-demo/web-entry-quantitative.browser.test.mjs
          WARP_WEB_ROOT=_site node --test web-demo/visual-editor-interactions.browser.test.mjs
          WARP_WEB_ROOT=_site node --test web-demo/visual-editor-browser.test.mjs
          WARP_WEB_ROOT=_site node --test web-demo/debug-toggle-browser.test.mjs
          WARP_WEB_ROOT=_site node --test web-demo/visual-editor-platform/browser.test.mjs
          WARP_WEB_ROOT=_site node --test web-demo/wasm-browser-smoke.test.mjs
          WARP_WEB_ROOT=_site node --test web-demo/entry-smoke.test.mjs
          WARP_WEB_ROOT=_site node --test web-demo/parameter-unit-browser.test.mjs
      - name: Check browser resource wiring
        run: |
          test -s web-demo/index.html
          test -s web-demo/app.mjs
          test -s web-demo/processor.worker.mjs
          test -s web-demo/realtime.worklet.js
          test -s web-demo/style.css
          grep -q './realtime.worklet.js' web-demo/app.mjs
          grep -q 'frequency-warp-rust' web-demo/realtime.worklet.js
          grep -q 'warp_stream_process' web-demo/realtime.worklet.js
          grep -q './dsp_core.wasm' web-demo/processor.worker.mjs
          grep -q 'warp_map_frequency' web-demo/app.mjs
          grep -q 'warp_fold_frequency' web-demo/app.mjs
          grep -q 'warp_stream_render_f32_zero_controls_ext' web-demo/processor.worker.mjs
          grep -q 'warp_stream_set_a_quality' web-demo/realtime.worklet.js
          grep -q 'warp_stream_set_zero_reflect_gain' web-demo/realtime.worklet.js
          grep -q 'warp_stream_set_zero_reflect_decay' web-demo/realtime.worklet.js
          grep -q 'warp_stream_set_a_band' web-demo/realtime.worklet.js
          grep -q 'warp_stream_set_a_options' web-demo/realtime.worklet.js
          grep -q 'warp_translate_frequency_anchored' web-demo/app.mjs
          grep -q 'warp_stream_set_geometry' web-demo/realtime.worklet.js
          grep -q 'warp_stream_set_transform' web-demo/realtime.worklet.js
          grep -q 'warp_stream_set_crusher' web-demo/realtime.worklet.js
          grep -q 'warp_stream_create_ext' web-demo/realtime.worklet.js
          test -s web-demo/mapping-oracle.test-helper.mjs
          if grep -q 'function mapFrequency' web-demo/dsp.mjs; then echo 'DUPLICATE DSP MAPPING IN PRODUCTION'; exit 1; fi
