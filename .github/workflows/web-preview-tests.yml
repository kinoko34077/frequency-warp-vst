name: Browser audio preview tests

on:
  pull_request:
    paths:
      - 'web-demo/**'
      - '.github/workflows/web-preview-tests.yml'
  push:
    branches: [main]
    paths:
      - 'web-demo/**'
      - '.github/workflows/web-preview-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual JS FFT/STFT output and stereo phase
        run: node --test web-demo/dsp.test.mjs
      - name: Install browser smoke dependency and locate Chrome
        run: |
          npm install --no-save --no-package-lock puppeteer-core@24
          command -v google-chrome
      - name: Test standalone file upload and DSP in headless Chrome
        run: node --test web-demo/browser-smoke.test.mjs
      - name: Check browser resources exist
        run: |
          test -s web-demo/index.html
          test -s web-demo/app.mjs
          test -s web-demo/processor.worker.mjs
          test -s web-demo/style.css
          grep -q './app.mjs' web-demo/index.html
          grep -q './processor.worker.mjs' web-demo/app.mjs
