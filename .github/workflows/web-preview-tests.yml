name: Browser audio preview and shared Rust/WASM CI

on:
  pull_request:
    paths:
      - 'core/**'
      - 'web-demo/**'
      - '.github/workflows/web-preview-tests.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'web-demo/**'
      - '.github/workflows/web-preview-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure native Rust and WASM toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Native Rust core tests
        run: cargo test --manifest-path core/Cargo.toml
      - name: Build exact same Rust DSP for WASM
        run: |
          cargo build --manifest-path core/Cargo.toml --release --target wasm32-unknown-unknown
          cp core/target/wasm32-unknown-unknown/release/frequency_warp_core.wasm web-demo/dsp_core.wasm
          test -s web-demo/dsp_core.wasm
      - name: UI-only helper checks
        run: node --test web-demo/dsp.test.mjs web-demo/harmonics.test.mjs
      - name: Shared WASM math and real audio output checks
        run: node --test web-demo/core-wasm.test.mjs
      - name: Install headless Chrome client
        run: |
          npm install --no-save --no-package-lock puppeteer-core@24
          command -v google-chrome
      - name: Chrome realtime streaming and waveform seek
        run: node --test web-demo/wasm-browser-smoke.test.mjs
      - name: Check browser resource wiring
        run: |
          test -s web-demo/index.html
          test -s web-demo/app.mjs
          test -s web-demo/processor.worker.mjs
          test -s web-demo/realtime.worklet.js
          test -s web-demo/style.css
          grep -q './realtime.worklet.js' web-demo/app.mjs
          grep -q 'frequency-warp-rust' web-demo/realtime.worklet.js
          grep -q 'warp_stream_process' web-demo/realtime.worklet.js
          grep -q './dsp_core.wasm' web-demo/processor.worker.mjs
          grep -q 'warp_map_frequency' web-demo/app.mjs
          grep -q 'warp_fold_frequency' web-demo/app.mjs
          grep -q 'warp_stream_render_f32_ext' web-demo/processor.worker.mjs
          grep -q 'warp_stream_create_ext' web-demo/realtime.worklet.js
          test -s web-demo/mapping-oracle.test-helper.mjs
          if grep -q 'function mapFrequency' web-demo/dsp.mjs; then echo 'DUPLICATE DSP MAPPING IN PRODUCTION'; exit 1; fi
