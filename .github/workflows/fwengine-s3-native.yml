name: S3a native WASM engine isolation and module swap
on:
  pull_request:
    paths:
      - 'fwengine-runtime/**'
      - 'vst3/tests/native/**'
      - 'vst3/src/native_engine_abi.h'
      - 'vst3/src/native_worker_service.h'
      - 'vst3/src/async_pcm_mailbox.h'
      - 'vst3/src/rt_swap_mailbox.h'
      - 'vst3/src/stream_host_events.h'
      - 'vst3/src/engine_project_state.h'
      - 'fwengine-demo/**'
      - 'fwengine-stream/**'
      - 'fwengine-package/**'
      - 'scripts/fwengine_pack.py'
      - '.github/workflows/fwengine-s3-native.yml'
  push:
    branches: [main]
    paths:
      - 'fwengine-runtime/**'
      - 'fwengine-stream/**'
      - 'vst3/tests/native/**'
      - 'vst3/src/native_engine_abi.h'
      - 'vst3/src/native_worker_service.h'
      - 'vst3/src/async_pcm_mailbox.h'
      - 'vst3/src/rt_swap_mailbox.h'
      - 'vst3/src/stream_host_events.h'
      - 'vst3/src/engine_project_state.h'
      - 'fwengine-demo/**'
      - 'fwengine-package/**'
      - 'scripts/fwengine_pack.py'
      - '.github/workflows/fwengine-s3-native.yml'
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wasm32 Rust target
        run: rustup target add wasm32-unknown-unknown
      - name: Compile fixture Identity and Gain modules
        shell: bash
        run: |
          cargo build --release --manifest-path fwengine-demo/Cargo.toml --target wasm32-unknown-unknown
          mkdir -p _s3
          cp fwengine-demo/target/wasm32-unknown-unknown/release/fwengine_demo.wasm _s3/identity.wasm
          cargo build --release --manifest-path fwengine-demo/Cargo.toml --target wasm32-unknown-unknown --features gain-half
          cp fwengine-demo/target/wasm32-unknown-unknown/release/fwengine_demo.wasm _s3/gain.wasm
          python scripts/fwengine_pack.py _s3/identity.wasm _s3/identity.fwengine org.kinotch.identity
          python scripts/fwengine_pack.py _s3/gain.wasm _s3/gain.fwengine org.kinotch.gainhalf
          cargo build --release --manifest-path fwengine-stream/Cargo.toml --target wasm32-unknown-unknown
          python scripts/fwengine_pack.py fwengine-stream/target/wasm32-unknown-unknown/release/fwengine_stream.wasm _s3/stream.fwengine org.kinotch.stream --latency 1023
          # Simulate a pre-capability Stream module embedded in a legacy DAW project.
          cargo build --release --manifest-path fwengine-stream/Cargo.toml --target wasm32-unknown-unknown --features legacy-no-mask
          python scripts/fwengine_pack.py fwengine-stream/target/wasm32-unknown-unknown/release/fwengine_stream.wasm _s3/stream_legacy.fwengine org.kinotch.stream --latency 1023
          cargo build --release --manifest-path fwengine-stream/Cargo.toml --target wasm32-unknown-unknown --features legacy-fourteen-mask
          python scripts/fwengine_pack.py fwengine-stream/target/wasm32-unknown-unknown/release/fwengine_stream.wasm _s3/stream_legacy14.fwengine org.kinotch.stream --latency 1023
      - name: Native interpreter compile and fuel/trap tests
        shell: bash
        run: cargo test --release --manifest-path fwengine-runtime/Cargo.toml
      - name: Actual native PCM from independently compiled single-file modules
        shell: bash
        run: cargo run --release --manifest-path fwengine-runtime/Cargo.toml -- _s3/identity.fwengine _s3/gain.fwengine

      - name: Build native Rust C ABI static library
        shell: bash
        run: cargo build --release --lib --manifest-path fwengine-runtime/Cargo.toml
      - name: Link native C++ caller to Rust static library and compare actual audio
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$GITHUB_WORKSPACE/fwengine-runtime/target/release/fwengine_runtime.lib"
          else
            archive="$GITHUB_WORKSPACE/fwengine-runtime/target/release/libfwengine_runtime.a"
          fi
          cmake -S vst3/tests/native -B _bridge_build -DFW_NATIVE_ARCHIVE="$archive"
          cmake --build _bridge_build --config Release
          if [ "$RUNNER_OS" = "Windows" ]; then
            _bridge_build/Release/fw_native_bridge_smoke.exe _s3/identity.fwengine _s3/gain.fwengine
            _bridge_build/Release/fw_native_worker_verified_identity_test.exe _s3/identity.fwengine _s3/gain.fwengine
            _bridge_build/Release/fw_native_worker_service_smoke.exe _s3/identity.fwengine _s3/gain.fwengine _s3/stream.fwengine _s3/stream_legacy.fwengine _s3/stream_legacy14.fwengine
          else
            _bridge_build/fw_native_bridge_smoke _s3/identity.fwengine _s3/gain.fwengine
            _bridge_build/fw_native_worker_verified_identity_test _s3/identity.fwengine _s3/gain.fwengine
            _bridge_build/fw_native_worker_service_smoke _s3/identity.fwengine _s3/gain.fwengine _s3/stream.fwengine _s3/stream_legacy.fwengine _s3/stream_legacy14.fwengine
          fi
