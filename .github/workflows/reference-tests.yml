name: Offline frequency-warp reference tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference test dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run deterministic mapping and DSP reference tests
        run: python -m unittest discover -s tests -v
      - name: Report R2.1 shared-corpus candidate measurements
        run: python -m research.evaluate_stft
