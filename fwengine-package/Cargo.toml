[package]
name = "fwengine-package"
version = "0.1.0"
edition = "2021"
description = "Native verifiable .fwengine archive loader for the stable VST3 shell"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
